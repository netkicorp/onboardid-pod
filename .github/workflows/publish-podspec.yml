name: Publish Podspec

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish to Trunk
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from podspec
        id: version
        run: |
          VERSION=$(grep "s.version" NetkiSDK.podspec | head -1 | sed -E "s/.*'(.*)'.*/\1/")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Detected version: $VERSION"

      - name: Validate podspec
        run: pod lib lint NetkiSDK.podspec --allow-warnings

      - name: Setup CocoaPods Trunk credentials
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          echo "machine trunk.cocoapods.org" >> ~/.netrc
          echo "  login ops@netki.com" >> ~/.netrc
          echo "  password $COCOAPODS_TRUNK_TOKEN" >> ~/.netrc
          chmod 0600 ~/.netrc

      - name: Push to CocoaPods Trunk
        # Best-effort until 2 December 2026, when Trunk stops accepting new Podspecs. The
        # Netki spec source below is what the release actually depends on.
        continue-on-error: true
        run: |
          # Trunk pushes intermittently exit non-zero on a post-commit GitHub API
          # timeout even though the spec was already registered. Make this
          # idempotent: skip if already published, retry transient failures, and
          # treat "already on trunk" as success so a re-run can't duplicate-fail.
          published() { pod trunk info NetkiSDK 2>/dev/null | grep -qF -- "- $VERSION ("; }

          if published; then
            echo "NetkiSDK $VERSION is already on trunk; nothing to push."
            exit 0
          fi

          for attempt in 1 2 3; do
            echo "Trunk push attempt $attempt..."
            if pod trunk push NetkiSDK.podspec --allow-warnings; then
              exit 0
            fi
            if published; then
              echo "Push returned non-zero but $VERSION is now on trunk; treating as success."
              exit 0
            fi
            echo "Attempt $attempt failed and $VERSION not on trunk; retrying in 30s..."
            sleep 30
          done

          echo "::error::pod trunk push failed after 3 attempts; $VERSION is not on trunk."
          exit 1

      - name: Publish to the Netki spec source
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          # CocoaPods Trunk stops accepting new Podspecs on 2 December 2026, so every release
          # is also written to our own spec source. This step is the one that has to keep
          # working after that date; the Trunk push above is best-effort until then.
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/netkicorp/Specs.git" /tmp/netki-specs

          DEST="/tmp/netki-specs/Specs/NetkiSDK/$VERSION"
          if [ -f "$DEST/NetkiSDK.podspec.json" ]; then
            echo "NetkiSDK $VERSION is already in the spec source; nothing to publish."
            exit 0
          fi

          mkdir -p "$DEST"
          pod ipc spec NetkiSDK.podspec > "$DEST/NetkiSDK.podspec.json"

          # A spec that does not parse is worse than a missing one: it breaks resolution for
          # every version, not just this release.
          python3 -c "import json,sys; json.load(open('$DEST/NetkiSDK.podspec.json'))"

          cd /tmp/netki-specs
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Specs/NetkiSDK/$VERSION/NetkiSDK.podspec.json"
          git commit -m "NetkiSDK $VERSION"
          git push origin HEAD:main

      - name: Notify success
        if: success()
        run: |
          echo "Published NetkiSDK $VERSION"
          echo "  spec source: https://github.com/netkicorp/Specs/tree/main/Specs/NetkiSDK/$VERSION"
          echo "  trunk:       https://cocoapods.org/pods/NetkiSDK"
